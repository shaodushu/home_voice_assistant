name: home_voice_assistant
description: "AI Voice Assistant for Home Assistant - VAD + STT + LLM + TTS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Audio Recording & Playback
  record: ^7.0.0
  audioplayers: ^6.1.0

  # Networking
  web_socket_channel: ^3.0.2

  # On-device Whisper STT + Silero VAD
  whisper_ggml_plus: ^1.5.2

  # TTS
  flutter_tts: ^4.2.2

  # UI
  cupertino_icons: ^1.0.8
  lottie: ^3.3.1
  shimmer: ^3.0.0

  # Utilities
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
